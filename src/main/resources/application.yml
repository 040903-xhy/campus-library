server:
  port: 8081

spring:
  application:
    name: campus-library
  datasource:
    url: jdbc:h2:mem:library;MODE=LEGACY;NON_KEYWORDS=USER
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # 仅开发演示用；生产环境务必改成环境变量注入的长随机串
  secret: campus-library-secret-key-2026-do-not-use-in-prod-64bytes-long-string
  expire-hours: 24
